<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>3XyzMedia LOGO MORPH Pilot</title>
<style>html,body{margin:0;width:100%;height:100%;background:#05070b;color:#eaf8ff;font-family:Arial,sans-serif;overflow:hidden}#pano{position:absolute;inset:0}#controls{position:fixed;z-index:10;left:12px;top:12px;background:rgba(5,9,17,.9);padding:14px;border:1px solid #316884;border-radius:12px;max-width:310px}button{padding:10px;margin:4px 2px;background:#12688b;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}small{display:block;line-height:1.5;color:#a9c4d2;margin:6px}#status{font-size:12px;color:#ccebf6}label{display:block;margin-top:6px}input{width:100%}</style>
</head><body><div id="pano"></div><div id="controls"><strong>⚛ 3XyzMedia — LOGO MORPH PILOT</strong><small>Отдельный эксперимент. Рабочую STUDIO v6 не меняет. 512 точек-целей, выбранных из настоящих 32 000 координат.</small><button id="go">▶ Модель → 3D-логотип → модель</button><button id="back">↶ Восстановить</button><label>Морфинг: <span id="val">0%</span><input id="progress" type="range" min="0" max="100" value="0"></label><small id="status">Загрузка модели…</small></div>
<script src="/VIEWER/krpano.js"></script><script>
'use strict';let kp=null,raf=0;
const status=document.getElementById('status'),range=document.getElementById('progress'),val=document.getElementById('val');
function morph(t){if(!kp)return;const p=Math.min(1,Math.max(0,t));try{kp.set('image.splats.fx_mode',8);kp.set('image.splats.fx_progress',p);range.value=Math.round(p*100);val.textContent=Math.round(p*100)+'%';}catch(e){status.textContent='Ошибка shader: '+e.message;}}
function reset(){cancelAnimationFrame(raf);raf=0;morph(0);if(kp)kp.set('image.splats.fx_mode',0);status.textContent='Исходная модель восстановлена';}
function play(){if(!kp){status.textContent='Модель ещё не загружена';return;}cancelAnimationFrame(raf);let t0=performance.now();status.textContent='Проверяем перемещение существующих Gaussian-сплатов…';function tick(now){const u=Math.min(1,(now-t0)/7000);let p;if(u<.44){let q=u/.44;p=q*q*(3-2*q);}else if(u<.60){p=1;}else{let q=(u-.60)/.40;p=1-q*q*(3-2*q);}morph(p);if(u<1)raf=requestAnimationFrame(tick);else reset();}raf=requestAnimationFrame(tick);}
range.addEventListener('input',()=>{cancelAnimationFrame(raf);raf=0;morph(Number(range.value)/100);});
document.getElementById('go').addEventListener('click',play);document.getElementById('back').addEventListener('click',reset);
if(typeof embedpano==='undefined'){status.textContent='krpano.js не найден по пути /VIEWER/krpano.js';}else{embedpano({target:'pano',xml:'scene_logo_pilot.xml',html5:'only+webgl',bgcolor:'#05070b',onready:function(k){kp=k;status.textContent='krpano подключён. Дождись появления PLY и нажми ▶.';}})}
</script></body></html>
