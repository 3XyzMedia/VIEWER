<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3XyzMedia FIRE v54</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;background:transparent}
html.preview,html.preview body{background:#030306}html.preview canvas{width:min(100vw, 77.77vh);height:auto;aspect-ratio:7/9;margin:auto}
</style></head><body><canvas id="fire" width="700" height="900"></canvas><script>
'use strict';
if(window.top===window.self)document.documentElement.classList.add('preview');
const cv=document.getElementById('fire'), ctx=cv.getContext('2d',{alpha:true});
window.parent?.postMessage({type:'xyz-firebed-ready-v54'},location.origin);
const W=700,H=900,cx=350,baseY=468;
const tongues=[],sparks=[];let last=0,firebedOn=true;
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='xyz-firebed-v54')firebedOn=!!e.data.enabled});
function seeded(seed){return ()=>{seed|=0;seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return ((t^t>>>14)>>>0)/4294967296}}
const rng=seeded(410247);
const rr=(a,b)=>a+rng()*(b-a),rand=(a,b)=>a+Math.random()*(b-a);
const bed=document.createElement('canvas');bed.width=W;bed.height=H;const bc=bed.getContext('2d',{alpha:true});
function hotGlow(c,x,y,r,strength=1){let g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,236,144,${.80*strength})`);g.addColorStop(.15,`rgba(255,130,22,${.55*strength})`);g.addColorStop(.52,`rgba(188,38,12,${.28*strength})`);g.addColorStop(1,'rgba(190,20,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
// One-time firebed cache. Nothing expensive is recomputed every animation frame.
function drawEmberBed(){
 bc.save();
 // A non-uniform ridge of irregular, charred and incandescent coals.
 const lumps=[];
 for(let i=0;i<98;i++){
   let x=rr(115,590),spread=Math.pow(1-Math.abs(x-cx)/240,0.45);
   let y=baseY+rr(-38,67)-spread*rr(5,26),r=rr(4,14);
   lumps.push({x,y,r,rot:rr(-.7,.7),hot:rr(.3,1)})
 }
 for(const p of lumps){
   hotGlow(bc,p.x,p.y,rr(13,34),p.hot*.47);
 }
 for(const p of lumps){
   bc.save();bc.translate(p.x,p.y);bc.rotate(p.rot);
   let sides=5+Math.floor(rr(0,4)),pts=[];
   for(let i=0;i<sides;i++){let angle=2*Math.PI*i/sides;let rad=p.r*rr(.67,1.23);pts.push([Math.cos(angle)*rad,Math.sin(angle)*rad*.65]);}
   bc.beginPath();pts.forEach(([x,y],i)=>i?bc.lineTo(x,y):bc.moveTo(x,y));bc.closePath();
   const g=bc.createLinearGradient(-p.r,-p.r,p.r,p.r);
   g.addColorStop(0,p.hot>.7?'#57220c':'#322019');g.addColorStop(.52,'#190f0c');g.addColorStop(1,'#0a0808');bc.fillStyle=g;bc.fill();
   bc.lineWidth=rr(.9,2.3);bc.strokeStyle=`rgba(255,${Math.round(rr(55,125))},${Math.round(rr(7,27))},${(.36+p.hot*.50).toFixed(2)})`;bc.stroke();
   for(let j=0;j<2;j++) {bc.beginPath();let xx=rr(-p.r*.5,p.r*.5),yy=rr(-p.r*.2,p.r*.2);bc.moveTo(xx-rr(2,5),yy);bc.lineTo(xx,yy-rr(1,4));bc.lineTo(xx+rr(1,5),yy+rr(1,4));bc.strokeStyle=`rgba(255,${Math.round(rr(65,185))},18,${(p.hot*.76).toFixed(2)})`;bc.lineWidth=rr(.5,1.7);bc.stroke();}
   bc.restore();
 }
 // Three distinct charred logs like Variant B: left, right, short foreground.
 function log(x,y,w,h,angle){
   bc.save();bc.translate(x,y);bc.rotate(angle);
   hotGlow(bc,0,0,w*.5,.27);
   const g=bc.createLinearGradient(0,-h,0,h);
   g.addColorStop(0,'#523020');g.addColorStop(.28,'#21120e');g.addColorStop(.69,'#090807');g.addColorStop(1,'#45180c');
   bc.beginPath();bc.moveTo(-w*.52,-h*.30);
   for(let i=0;i<=8;i++){let q=i/8;bc.lineTo(-w*.5+w*q, -h*.54+Math.sin(q*15)*rr(0,4));}
   bc.lineTo(w*.52,h*.32);
   for(let i=8;i>=0;i--){let q=i/8;bc.lineTo(-w*.5+w*q,h*.53+Math.cos(q*14)*rr(0,3));}
   bc.closePath();bc.fillStyle=g;bc.fill();
   for(let i=0;i<8;i++){
     const bx=rr(-w*.45,w*.45),by=rr(-h*.35,h*.35);
     bc.beginPath();bc.moveTo(bx-rr(3,15),by);bc.lineTo(bx,by+rr(-5,4));bc.lineTo(bx+rr(3,13),by+rr(-4,6));
     bc.strokeStyle=i%3===0?'rgba(255,110,19,.72)':'rgba(116,70,45,.70)';bc.lineWidth=i%3===0?1.6:1;bc.stroke();
   }
   bc.restore();
 }
 log(205,baseY+13,114,30,-.58);log(311,baseY+24,170,34,.30);log(456,baseY+16,178,31,-.34);log(385,baseY+52,106,25,.61);log(260,baseY+59,110,22,-.13);
 // Fine embers protrude from the edge without an underlying rectangular backdrop.
 for(let i=0;i<70;i++){let x=rr(128,568),y=baseY+rr(-29,56),r=rr(.5,2.8);hotGlow(bc,x,y,r*3.1,rr(.14,.6))}
 bc.restore();
}
drawEmberBed();
function makeTongue(){let side=rand(-1,1),life=rand(.55,1.25);return{x:rand(-125,125),y:0,vx:side*rand(.08,.42),vy:rand(2.8,6.5),life,max:life,w:rand(18,42),h:rand(90,210),skew:rand(-.18,.18),phase:rand(0,6.28),core:rand(.2,1)}}
function makeSpark(){let life=rand(.45,1.15);return{x:rand(-120,120),y:0,vx:rand(-1.6,1.6),vy:rand(4,10),life,max:life,r:rand(1.2,3.4)}}
function ellipseGlow(x,y,w,h,a){ctx.save();ctx.translate(x,y);ctx.scale(1,h/Math.max(1,w));const g=ctx.createRadialGradient(0,0,0,0,0,w);g.addColorStop(0,`rgba(255,255,230,${a})`);g.addColorStop(.12,`rgba(255,234,150,${a*.98})`);g.addColorStop(.36,`rgba(255,154,44,${a*.8})`);g.addColorStop(.76,`rgba(214,48,10,${a*.34})`);g.addColorStop(1,'rgba(70,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,w,0,Math.PI*2);ctx.fill();ctx.restore();}
function draw(now){const dt=Math.min(.05,(now-(last||now))/1000);last=now;ctx.clearRect(0,0,W,H);
 ctx.save();ctx.beginPath();ctx.rect(0,0,W,baseY+6);ctx.clip();
 if(tongues.length<90)for(let i=0;i<5;i++)tongues.push(makeTongue());
 if(sparks.length<80)for(let i=0;i<4;i++)sparks.push(makeSpark());
 ctx.globalCompositeOperation='lighter';ellipseGlow(cx,baseY-8,118,44,.24);ellipseGlow(cx,baseY-16,68,120,.14);
 for(let i=tongues.length-1;i>=0;i--){const p=tongues[i];p.life-=dt;if(p.life<=0){tongues.splice(i,1);continue;}const f=p.life/p.max,age=1-f;p.phase+=dt*(2.2+age*4.2);p.x+=(p.vx+Math.sin(p.phase)*.34+p.skew*age)*dt*62;p.y+=p.vy*dt*60;const x=cx+p.x,y=baseY-p.y,h=p.h*(.4+.95*f),w=p.w*(.55+.55*f),a=.12+.24*f;ctx.save();ctx.translate(x,y);ctx.rotate(p.skew+Math.sin(p.phase)*.1);ellipseGlow(0,0,w*1.05,h,a*.85);ellipseGlow(0,-h*.08,w*.62,h*.58,a*1.1*p.core);ellipseGlow(0,-h*.14,w*.28,h*.26,a*.95*p.core);ctx.restore();}
 for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.life-=dt;if(p.life<=0){sparks.splice(i,1);continue;}p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;const a=.15+.85*p.life/p.max,x=cx+p.x,y=baseY-p.y,g=ctx.createRadialGradient(x,y,0,x,y,p.r*4.5);g.addColorStop(0,`rgba(255,245,200,${a})`);g.addColorStop(.4,`rgba(255,182,70,${a*.82})`);g.addColorStop(1,'rgba(255,120,20,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,p.r*4.5,0,7);ctx.fill();}
 ctx.restore();
 // Pre-rendered natural log/coal bed overlays the line, irregular lower silhouette, 1 drawImage/frame.
 if(firebedOn)ctx.drawImage(bed,0,0);
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
