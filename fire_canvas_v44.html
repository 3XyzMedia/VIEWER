<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}canvas{display:block;width:100%;height:100%;background:transparent;}</style></head>
<body><canvas id="fire" width="600" height="700"></canvas><script>
'use strict';
const cv=document.getElementById('fire'), ctx=cv.getContext('2d',{alpha:true});
const flames=[],sparks=[];let last=0;
const rand=(a,b)=>a+Math.random()*(b-a);
function newFlame(){return {x:rand(-130,130),y:0,vx:rand(-.75,.75),vy:rand(1.9,5.2),life:rand(.5,1.25),max:0,r:rand(27,67),phase:rand(0,7)};}
function newSpark(){return {x:rand(-125,125),y:0,vx:rand(-1.3,1.3),vy:rand(3,8),life:rand(.5,1.15),max:0,r:rand(1,3)};}
function draw(now){
 const dt=Math.min(.05,(now-(last||now))/1000);last=now;
 ctx.clearRect(0,0,600,700);
 if(flames.length<55)for(let i=0;i<4;i++){let p=newFlame();p.max=p.life;flames.push(p)}
 if(sparks.length<50)for(let i=0;i<3;i++){let p=newSpark();p.max=p.life;sparks.push(p)}
 ctx.globalCompositeOperation='lighter';
 for(let i=flames.length-1;i>=0;i--){let p=flames[i];p.life-=dt;if(p.life<=0){flames.splice(i,1);continue}
  p.phase+=dt*3;p.x+=(p.vx+Math.sin(p.phase)*.5)*dt*60;p.y+=p.vy*dt*60;
  const f=p.life/p.max, rad=p.r*(.4+.65*f),x=300+p.x,y=555-p.y;
  const a=.28*f;const g=ctx.createRadialGradient(x,y,0,x,y,rad);
  g.addColorStop(0,`rgba(255,255,228,${a})`);g.addColorStop(.13,`rgba(255,232,121,${a*.94})`);
  g.addColorStop(.36,`rgba(255,129,30,${a*.86})`);g.addColorStop(.72,`rgba(230,45,7,${a*.36})`);g.addColorStop(1,'rgba(90,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();
 }
 for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];s.life-=dt;if(s.life<=0){sparks.splice(i,1);continue}
 s.x+=s.vx*dt*60;s.y+=s.vy*dt*60;
 ctx.fillStyle=`rgba(255,207,85,${.85*s.life/s.max})`;ctx.beginPath();ctx.arc(300+s.x,555-s.y,s.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalCompositeOperation='source-over';requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
