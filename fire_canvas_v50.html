<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}canvas{display:block;width:100%;height:100%;background:transparent}</style></head>
<body><canvas id="fire" width="700" height="900"></canvas><script>
'use strict';
const cv=document.getElementById('fire'), ctx=cv.getContext('2d',{alpha:true});
const tongues=[], sparks=[]; let last=0;
const rand=(a,b)=>a+Math.random()*(b-a);
function newTongue(){
  const side=(Math.random()*2-1);
  return {x:rand(-125,125), y:0, vx:side*rand(0.08,0.42), vy:rand(2.8,6.5), life:rand(0.55,1.25), max:0, w:rand(18,42), h:rand(90,210), skew:rand(-0.18,0.18), phase:rand(0,6.28318), core:Math.random()*0.8+0.2};
}
function newSpark(){ return {x:rand(-120,120), y:0, vx:rand(-1.6,1.6), vy:rand(4.0,10.0), life:rand(0.45,1.15), max:0, r:rand(1.2,3.4)}; }

function drawEmbers(now,cx,y){
  // Simple static-style embers; small fixed work per frame and no pixel filters.
  ctx.save();ctx.globalCompositeOperation='source-over';
  for(let i=0;i<18;i++){
    const bx=cx-135+i*15+(i%3-1)*4;
    const by=y+3+7*Math.sin(i*2.37);
    const r=6+(i*7)%9;
    ctx.fillStyle=i%4===0?'rgba(55,36,32,0.88)':'rgba(40,29,26,0.95)';
    ctx.beginPath();ctx.ellipse(bx,by,r*1.3,r*.68,(i%5-2)*.18,0,Math.PI*2);ctx.fill();
    const pulse=.68+.32*Math.sin(now*.0023+i*3.17);
    const g=ctx.createRadialGradient(bx,by,0,bx,by,r*.95);
    g.addColorStop(0,`rgba(255,214,92,${.58*pulse})`);
    g.addColorStop(.35,`rgba(255,95,18,${.52*pulse})`);
    g.addColorStop(.8,`rgba(135,24,8,${.24*pulse})`);
    g.addColorStop(1,'rgba(60,10,4,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(bx,by,r*1.05,r*.46,(i%5-2)*.18,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function drawLog(x,y,w,h,rot){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot);
  const grad=ctx.createLinearGradient(-w*0.5,0,w*0.5,0);
  grad.addColorStop(0,'rgba(58,28,12,0.95)');
  grad.addColorStop(0.5,'rgba(96,52,22,0.98)');
  grad.addColorStop(1,'rgba(44,20,8,0.95)');
  ctx.fillStyle=grad;
  ctx.beginPath();
  const r=Math.min(h*0.5,18);
  ctx.moveTo(-w*0.5+r,-h*0.5); ctx.lineTo(w*0.5-r,-h*0.5); ctx.quadraticCurveTo(w*0.5,-h*0.5,w*0.5,h*0.0-r);
  ctx.quadraticCurveTo(w*0.5,h*0.5,w*0.5-r,h*0.5); ctx.lineTo(-w*0.5+r,h*0.5); ctx.quadraticCurveTo(-w*0.5,h*0.5,-w*0.5,h*0.0-r);
  ctx.quadraticCurveTo(-w*0.5,-h*0.5,-w*0.5+r,-h*0.5); ctx.fill();
  ctx.strokeStyle='rgba(25,10,4,0.45)'; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}
function ellipseGlow(x,y,w,h,a){
  ctx.save(); ctx.translate(x,y); ctx.scale(1,h/Math.max(1,w));
  const g=ctx.createRadialGradient(0,0,0,0,0,w);
  g.addColorStop(0,`rgba(255,255,230,${a})`);
  g.addColorStop(0.12,`rgba(255,234,150,${a*0.98})`);
  g.addColorStop(0.36,`rgba(255,154,44,${a*0.80})`);
  g.addColorStop(0.76,`rgba(214,48,10,${a*0.34})`);
  g.addColorStop(1,'rgba(70,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,w,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function draw(now){
 const dt=Math.min(0.05,(now-(last||now))/1000); last=now;
 const W=700,H=900,cx=W*0.5,baseY=H*0.56;
 ctx.clearRect(0,0,W,H);
 ctx.save();
 // One inexpensive irregular clipping contour, no destination-in multipass masking.
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);
 for(let i=32;i>=0;i--){
   const px=W*i/32;
   const edge=baseY+9 + 8*Math.sin(i*1.52) + 5*Math.sin(i*3.19+now*.0011);
   ctx.lineTo(px,edge);
 }
 ctx.closePath();ctx.clip();
 // birth
 if(tongues.length<90) for(let i=0;i<5;i++){ let p=newTongue(); p.max=p.life; tongues.push(p); }
 if(sparks.length<80) for(let i=0;i<4;i++){ let s=newSpark(); s.max=s.life; sparks.push(s); }
 // base glow
 ctx.globalCompositeOperation='lighter';
 ellipseGlow(cx, baseY-8, 118, 44, 0.24);
 ellipseGlow(cx, baseY-16, 68, 120, 0.14);
 // tongues
 for(let i=tongues.length-1;i>=0;i--){
   const p=tongues[i]; p.life-=dt; if(p.life<=0){tongues.splice(i,1); continue;}
   const f=p.life/p.max, age=1-f;
   p.phase += dt*(2.2+age*4.2);
   p.x += (p.vx + Math.sin(p.phase)*0.34 + p.skew*age)*dt*62;
   p.y += p.vy*dt*60;
   const x=cx+p.x, y=baseY-p.y;
   const h=p.h*(0.40+0.95*f), w=p.w*(0.55+0.55*f);
   const alpha=0.12 + 0.24*f;
   ctx.save();
   ctx.translate(x,y); ctx.rotate(p.skew + Math.sin(p.phase)*0.10);
   ellipseGlow(0,0,w*1.05,h,alpha*0.85);
   ellipseGlow(0,-h*0.08,w*0.62,h*0.58,alpha*1.1*p.core);
   ellipseGlow(0,-h*0.14,w*0.28,h*0.26,alpha*0.95*p.core);
   ctx.restore();
 }
 // sparks
 for(let i=sparks.length-1;i>=0;i--){
   const s=sparks[i]; s.life-=dt; if(s.life<=0){sparks.splice(i,1); continue;}
   s.x += s.vx*dt*60; s.y += s.vy*dt*60;
   const a=0.15 + 0.85*(s.life/s.max), x=cx+s.x, y=baseY-s.y;
   const g=ctx.createRadialGradient(x,y,0,x,y,s.r*4.5);
   g.addColorStop(0,`rgba(255,245,200,${a})`); g.addColorStop(0.4,`rgba(255,182,70,${a*0.82})`); g.addColorStop(1,'rgba(255,120,20,0)');
   ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,s.r*4.5,0,Math.PI*2); ctx.fill();
 }

 // Embers and crossed logs bridge the rough lower flame contour.
 drawLog(cx-56,baseY-4,145,19,-0.12);
 drawLog(cx+54,baseY+2,142,20,0.14);
 drawEmbers(now,cx,baseY-5);
 ctx.globalCompositeOperation='source-over';ctx.restore();
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
