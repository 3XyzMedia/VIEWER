<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3XyzMedia Viewer</title>
<style>*{box-sizing:border-box}html,body,#pano{height:100%;width:100%;margin:0;background:#05070b;overflow:hidden}body{font:14px Arial,sans-serif;color:white}#hud{position:absolute;top:9px;left:9px;z-index:10;display:flex;align-items:start;gap:6px;pointer-events:none}#hud>*{pointer-events:auto}.glass{background:#09111ab8;border:1px solid #4e677b80;color:#eff7ff;padding:8px 10px;border-radius:9px}button{cursor:pointer}#status{max-width:220px;font-size:11px;line-height:1.4}#error{display:none;position:absolute;z-index:30;bottom:12px;left:12px;right:12px;background:#28151de9;border:1px solid #a8434c;border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap}#videoLayer{display:none;position:fixed;z-index:15;bottom:22px;right:16px;background:#08090c;border:1px solid #516070;border-radius:12px;padding:6px;width:min(460px,78vw)}#videoLayer video{width:100%;display:block;max-height:40vh}#videoClose{position:absolute;top:-12px;right:-8px}#effect{display:none}#playtour{display:none}@media(max-width:600px){#videoLayer{width:min(86vw,430px)}#status{max-width:150px}}</style></head>
<body><div id="pano"></div><div id="hud"><span class="glass" id="status">Загрузка...</span><button id="reset" class="glass" title="Вернуть исходный вид">⌂</button><button id="playtour" class="glass">▶ TOUR</button><button id="effect" class="glass">✨ FX</button></div><div id="videoLayer"><button class="glass" id="videoClose">×</button><video controls playsinline controlsList="nodownload" disablePictureInPicture></video></div><div id="error"></div><script src="krpano.js"></script><script type="module">
const Q=new URLSearchParams(location.search), status=document.querySelector('#status'), error=document.querySelector('#error');
let config,viewer,loader;const fail=e=>{error.style.display='block';error.textContent='3XyzMedia Viewer: '+String(e.message||e);status.textContent='Ошибка загрузки';console.error(e)};
function decode(s){let b=s.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))))}
function norm(c){if(!c||typeof c!=='object'||!c.state)throw Error('Некорректный пресет');if(c.xml!=='scene_lite_soy.xml')throw Error('Для этой модели ещё нет LITE сцены. Ничего не подменено.');return c}
async function preset(){if(Q.has('p'))return norm(decode(Q.get('p')));const id=Q.get('id')||'soy';if(!/^[a-zA-Z0-9_-]{1,48}$/.test(id))throw Error('Некорректный ID');const r=await fetch('presets/'+id+'.json',{cache:'no-cache'});if(!r.ok)throw Error('Не найден пресет '+id);return norm(await r.json())}
function camera(st){const p=st.p||[0,0,0],m=st.m||[0,0,0],o=st.o||[0,0,0],yaw=(+o[0]||0)*Math.PI/180,pitch=(+o[1]||0)*Math.PI/180,d=+st.d||200,cp=Math.cos(pitch);const rot={'Z':[0,0,180],'-Z':[180,0,180],'Y':[-90,0,0],'-Y':[90,0,0],'X':[0,90,0],'-X':[0,-90,0]}[st.u]||[0,0,180];
 viewer.set('image.splats.rx',rot[0]);viewer.set('image.splats.ry',rot[1]);viewer.set('image.splats.rz',rot[2]);viewer.set('view.tx',(+p[0]||0)+(+m[0]||0)+Math.sin(yaw)*cp*d);viewer.set('view.ty',(+p[1]||0)+(+m[1]||0)+Math.sin(pitch)*d);viewer.set('view.tz',(+p[2]||0)+(+m[2]||0)+Math.cos(yaw)*cp*d);viewer.set('view.hlookat',(+o[0]||0)+180);viewer.set('view.vlookat',-(+o[1]||0));viewer.set('view.roll',+o[2]||0);viewer.set('view.fov',70);
 if(st.s!=null)viewer.set('display.splats.scale',+st.s);if(st.a!=null)viewer.set('image.splats.antialias',+st.a);viewer.call('view.update();')}
try{config=await preset();let st=config.state,f=config.features||{};const fx=!!f.fx&&Number.isInteger(+st.em)&&(+st.em>=1&&+st.em<=7), scene=fx?'scene_lite_fx.xml':config.xml;status.textContent='3XyzMedia · '+(config.title||'Viewer');
 if(typeof embedpano!=='function')throw Error('Файл krpano.js не найден рядом с Viewer');
 embedpano({target:'pano',xml:scene,html5:'only+webgl',focus:true,mobilescale:1,bgcolor:'#05070b',onready:async k=>{viewer=k;try{camera(st);document.querySelector('#reset').onclick=()=>camera(st);
 const ctx={viewer,config,dom:{status},setCamera:camera};
 if(f.tour&&Array.isArray(st.tour)&&st.tour.length>1){const mod=await import('./modules/tour.js');mod.setup(ctx)}
 if(f.video&&st.vu){const mod=await import('./modules/video.js');mod.setup(ctx)}
 if(fx){const mod=await import('./modules/fx.js');mod.setup(ctx)}
 status.textContent='3XyzMedia · '+(config.title||'Viewer');
 }catch(e){fail(e)}}});
}catch(e){fail(e)}
</script></body></html>
